<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocEasy — Speaker Detector Test</title>
<link rel="stylesheet" href="../assets/css/doceasy-global.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 0 12px 40px; }
  .panel { border: 1px solid #ccc; border-radius: 8px; padding: 14px; margin: 14px 0; }
  .btn { display: block; width: 100%; padding: 14px; font-size: 16px; margin: 8px 0; border-radius: 8px; border: none; color: #fff; background: #19398a; cursor: pointer; }
  .btn:disabled { background: #9aa5c9; cursor: not-allowed; }
  #logPanel { background: #0d0d12; color: #baffc9; font-family: monospace; font-size: 12px; height: 240px; overflow-y: auto; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  .result-box { background: #f4f6f9; border: 1px solid #ddd; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; }
  h1 { font-size: 18px; color: #19398a; }
  h2 { font-size: 15px; color: #19398a; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="doceasy-header"></div>

<h1>Speaker Detector — Test Harness</h1>
<p style="font-size:13px;color:#555;">Upload a short audio/video file to test automatic speaker detection.</p>

<div class="panel">
  <h2>1. Select File</h2>
  <input type="file" id="fileInput" accept="audio/*,video/*" style="width:100%;">
  <div id="fileInfo" style="font-size:14px; margin-top:8px;"></div>
</div>

<div class="panel">
  <h2>2. Detection Results</h2>
  <button class="btn" id="btnDetect" disabled>Detect Speakers</button>
  <div id="resultBox" class="result-box" style="margin-top:10px;">No results yet. Upload a file and click detect.</div>
</div>

<div class="panel">
  <h2>Log</h2>
  <div id="logPanel"></div>
</div>

<div id="doceasy-footer"></div>

<script src="../assets/js/core/doceasy-core.js"></script>
<script src="../assets/js/core/speaker-detector.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const logPanel = $('logPanel');
let logLines = [];

function log(msg, isError) {
  const time = new Date().toLocaleTimeString();
  const line = `[${time}] ${msg}`;
  logLines.push(line);
  if (logLines.length > 200) logLines.shift();
  logPanel.textContent = logLines.join('\n');
  logPanel.scrollTop = logPanel.scrollHeight;
  if (isError) console.error('[DocEasy Test]', msg);
  else console.log('[DocEasy Test]', msg);
}

let selectedFile = null;

$('fileInput').addEventListener('change', (e) => {
  selectedFile = e.target.files[0];
  if (selectedFile) {
    $('fileInfo').textContent = `Selected: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
    $('btnDetect').disabled = false;
    log(`Selected file: ${selectedFile.name}`);
  } else {
    $('fileInfo').textContent = '';
    $('btnDetect').disabled = true;
  }
});

$('btnDetect').addEventListener('click', async () => {
  if (!selectedFile) return;
  $('btnDetect').disabled = true;
  $('resultBox').textContent = 'Processing... Please wait.';
  log('Starting speaker detection...');

  try {
    const arrayBuffer = await selectedFile.arrayBuffer();
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    const audioContext = new AudioContextClass({ sampleRate: 44100 });
    
    log('Decoding audio...');
    const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
    log(`Audio decoded. Duration: ${audioBuffer.duration.toFixed(2)}s, Channels: ${audioBuffer.numberOfChannels}`);

    const detector = new SpeakerDetector({ sampleRate: audioContext.sampleRate });
    const segments = await detector.detect(audioBuffer);
    
    log(`Detection complete. Found ${segments.length} segments.`);
    
    // Format output
    if (segments.length === 0) {
      $('resultBox').textContent = 'No speech segments detected.';
    } else {
      let html = '<table style="width:100%; border-collapse:collapse; font-size:12px;">';
      html += '<tr style="background:#19398a; color:#fff;"><th>Start (s)</th><th>End (s)</th><th>Pitch (Hz)</th><th>Speaker ID</th><th>Confidence</th></tr>';
      segments.forEach(seg => {
        html += `<tr style="border-bottom:1px solid #ddd;">
          <td style="padding:4px;">${seg.start.toFixed(2)}</td>
          <td style="padding:4px;">${seg.end.toFixed(2)}</td>
          <td style="padding:4px;">${seg.pitch.toFixed(1)}</td>
          <td style="padding:4px; text-align:center; font-weight:bold; color:#19398a;">${seg.speakerId}</td>
          <td style="padding:4px;">${(seg.confidence * 100).toFixed(1)}%</td>
        </tr>`;
      });
      html += '</table>';
      $('resultBox').innerHTML = html;
    }
  } catch (err) {
    log('Error: ' + err.message, true);
    $('resultBox').textContent = 'Error: ' + err.message;
  } finally {
    $('btnDetect').disabled = false;
  }
});
</script>
</body>
</html>
