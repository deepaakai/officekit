<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocEasy — Video Worker Test</title>
<link rel="stylesheet" href="../assets/css/doceasy-global.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 85px 12px 40px; }
  .panel { border: 1px solid #ccc; border-radius: 8px; padding: 14px; margin: 14px 0; }
  .btn { display: block; width: 100%; padding: 14px; font-size: 16px; margin: 8px 0; border-radius: 8px; border: none; color: #fff; background: #19398a; cursor: pointer; }
  .btn:disabled { background: #9aa5c9; cursor: not-allowed; }
  .btn.danger { background: #b3261e; }
  canvas { width: 100%; max-width: 320px; height: auto; border: 1px solid #ccc; border-radius: 6px; margin-top: 8px; display: block; }
  #logPanel { background: #0d0d12; color: #baffc9; font-family: monospace; font-size: 12px; height: 200px; overflow-y: auto; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  h1 { font-size: 18px; color: #19398a; }
  h2 { font-size: 15px; color: #19398a; margin-bottom: 6px; }
  .flex-row { display: flex; gap: 10px; }
  .flex-row > div { flex: 1; }
</style>
</head>
<body>

<div id="doceasy-header"></div>

<h1>Video Worker — Test Harness</h1>
<p style="font-size:13px;color:#555;">Synthetic test: Encodes a canvas animation, filters it via worker-video.js, and decodes the result.</p>

<div class="panel">
  <h2>1. Controls</h2>
  <button class="btn" id="btnStart">Start Test</button>
  <button class="btn danger" id="btnStop" disabled>Stop Test</button>
</div>

<div class="panel">
  <h2>2. Visuals</h2>
  <div class="flex-row">
    <div>
      <strong>Original (Input)</strong>
      <canvas id="inputCanvas" width="320" height="240"></canvas>
    </div>
    <div>
      <strong>Filtered (Output)</strong>
      <canvas id="outputCanvas" width="320" height="240"></canvas>
    </div>
  </div>
</div>

<div class="panel">
  <h2>Log</h2>
  <div id="logPanel"></div>
</div>

<div id="doceasy-footer"></div>

<script src="../assets/js/core/doceasy-core.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let logLines = [];
let isRunning = false;

function log(msg, isError) {
  const time = new Date().toLocaleTimeString();
  const line = `[${time}] ${msg}`;
  logLines.push(line);
  if (logLines.length > 200) logLines.shift();
  $('logPanel').textContent = logLines.join('\n');
  $('logPanel').scrollTop = $('logPanel').scrollHeight;
  if (isError) console.error('[DocEasy Test]', msg);
  else console.log('[DocEasy Test]', msg);
}

// --- Synthetic Canvas Animation ---
const inputCtx = $('inputCanvas').getContext('2d');
const outputCtx = $('outputCanvas').getContext('2d');
let angle = 0;

function drawAnimation() {
  if (!isRunning) return;
  angle += 0.05;
  inputCtx.fillStyle = '#19398a';
  inputCtx.fillRect(0, 0, 320, 240);
  inputCtx.fillStyle = '#ffffff';
  const x = 160 + Math.cos(angle) * 80;
  const y = 120 + Math.sin(angle) * 80;
  inputCtx.beginPath();
  inputCtx.arc(x, y, 30, 0, Math.PI * 2);
  inputCtx.fill();
  inputCtx.fillStyle = '#ffcc00';
  inputCtx.fillRect(10, 10, 50, 50);
  requestAnimationFrame(drawAnimation);
}

// --- WebCodecs Main Thread Setup ---
let encoder = null;
let decoder = null;
let worker = null;
let frameCount = 0;
let inputChunks = [];

const VIDEO_CONFIG = {
  codec: 'vp8',
  width: 320,
  height: 240,
  bitrate: 500000,
  framerate: 30,
};

async function startTest() {
  isRunning = true;
  $('btnStart').disabled = true;
  $('btnStop').disabled = false;
  frameCount = 0;
  inputChunks = [];
  drawAnimation();

  log('Checking WebCodecs support...');
  const encSupport = await VideoEncoder.isConfigSupported(VIDEO_CONFIG);
  const decSupport = await VideoDecoder.isConfigSupported(VIDEO_CONFIG);
  
  if (!encSupport.supported || !decSupport.supported) {
    log('WebCodecs VP8 is not supported on this device/browser.', true);
    stopTest();
    return;
  }
  log('WebCodecs VP8 supported. Starting...');

  // 1. Setup Encoder to generate input chunks
  encoder = new VideoEncoder({
    output: (chunk, meta) => {
      const buf = new ArrayBuffer(chunk.byteLength);
      chunk.copyTo(buf);
      inputChunks.push({
        data: buf,
        timestamp: chunk.timestamp,
        duration: chunk.duration,
        type: chunk.type
      });
    },
    error: (e) => log('Encoder error: ' + e.message, true)
  });
  encoder.configure(VIDEO_CONFIG);

  // 2. Setup Worker
  worker = new Worker('../assets/js/core/worker-video.js');
  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'progress') {
      log(`Worker processed frame ${msg.framesProcessed} / ${msg.totalFrames}`);
    } else if (msg.type === 'chunk') {
      // Decode the filtered chunk and draw it
      decoder.decode(new EncodedVideoChunk({
        type: msg.chunk.type,
        timestamp: msg.chunk.timestamp,
        duration: msg.chunk.duration,
        data: msg.chunk.data
      }));
    } else if (msg.type === 'done') {
      log('Worker finished processing all frames.');
      stopTest();
    } else if (msg.type === 'error') {
      log('Worker error: ' + msg.message, true);
      stopTest();
    }
  };

  // 3. Setup Decoder to display worker output
  decoder = new VideoDecoder({
    output: (frame) => {
      outputCtx.drawImage(frame, 0, 0, 320, 240);
      frame.close();
    },
    error: (e) => log('Decoder error: ' + e.message, true)
  });
  decoder.configure(VIDEO_CONFIG);

  // 4. Feed frames to the encoder
  let frameIndex = 0;
  const interval = setInterval(() => {
    if (!isRunning || frameIndex >= 60) { // 60 frames = 2 seconds at 30fps
      clearInterval(interval);
      encoder.flush().then(() => {
        log(`Generated ${inputChunks.length} encoded chunks. Sending to worker...`);
        sendToWorker();
      });
      return;
    }

    const frame = new VideoFrame($('inputCanvas'), { timestamp: frameIndex * 33333 });
    encoder.encode(frame, { keyFrame: frameIndex % 30 === 0 });
    frame.close();
    frameIndex++;
  }, 33); // ~30fps
}

function sendToWorker() {
  worker.postMessage({
    type: 'process',
    jobId: 'test-job-video',
    encodedChunks: inputChunks,
    decoderConfig: VIDEO_CONFIG,
    encoderConfig: VIDEO_CONFIG,
    filters: {
      brightness: 20,
      contrast: 10,
      preset: 'cartoon' // Change to 'vintage' to test the other preset
    }
  });
}

function stopTest() {
  isRunning = false;
  $('btnStart').disabled = false;
  $('btnStop').disabled = true;
  if (encoder) { encoder.close(); encoder = null; }
  if (decoder) { decoder.close(); decoder = null; }
  if (worker) { worker.terminate(); worker = null; }
  log('Test stopped.');
}

$('btnStart').addEventListener('click', startTest);
$('btnStop').addEventListener('click', stopTest);
</script>
</body>
</html>
