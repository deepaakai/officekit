<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Writer — Hindi, English & Hinglish Typing with DOCX/PDF Export | DocEasy</title>
<meta name="description" content="Free online Word writer with Hindi, English, and Hinglish typing. Built-in Hindi keyboard, 13 fonts, header/footer, and Word/PDF export. 100% browser-based.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://deepaakai.github.io/officekit/tools/word-writer.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;600;700&family=Hind:wght@400;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Lora:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/doceasy-global.css">
<style>
* { box-sizing: border-box; }
.main-wrap { max-width: 1040px; margin: 0 auto; padding: 10px 16px 80px; }

/* ============ MODERN COMPACT TOOLBAR ============ */
.toolbar-container {
  background: var(--card-bg, #ffffff);
  border: 1px solid var(--border-color, #e5e7eb);
  border-radius: 14px;
  padding: 8px 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  position: sticky;
  top: 10px;
  z-index: 100;
}
.tb-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #f8fafc;
  padding: 3px 6px;
  border-radius: 9px;
  border: 1px solid #e2e8f0;
}
.tb-select {
  height: 32px;
  border: 1px solid transparent;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-color, #1e293b);
  cursor: pointer;
  outline: none;
  border-radius: 6px;
  padding: 0 4px;
}
.tb-select:hover { background: #edf2f7; }
.tb-btn {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: #334155;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tb-btn:hover { background: #e2e8f0; color: var(--accent, #19398a); }
.tb-btn.active { background: var(--accent, #19398a); color: #ffffff !important; }
.tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.tb-btn.hindi-btn {
  width: auto;
  padding: 0 10px;
  gap: 6px;
  background: #fff7ed;
  color: #ea580c;
  border: 1px solid #fdba74;
}
.tb-btn.hindi-btn:hover, .tb-btn.hindi-btn.active { background: #ea580c; color: #fff !important; }

.color-picker-box {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 32px;
  padding: 0 6px;
  border-radius: 6px;
  cursor: pointer;
}
.color-picker-box input[type="color"] {
  width: 22px;
  height: 22px;
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 0;
  border-radius: 4px;
}

/* Watermark Toggle Button */
.wm-btn {
  font-size: 11.5px;
  font-weight: 700;
  padding: 0 10px;
  height: 32px;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  background: #f1f5f9;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.wm-btn.active { background: #dcfce7; color: #15803d; border-color: #86efac; }

/* ============ HEADER & FOOTER ============ */
.hf-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  margin-bottom: 8px;
}
.hf-row.disabled { opacity: 0.5; background: #f8fafc; }
.hf-row.disabled input { pointer-events: none; }
.hf-label { font-size: 11px; font-weight: 800; color: #64748b; text-transform: uppercase; width: 55px; }
.hf-input { flex: 1; border: none; outline: none; background: transparent; font-size: 13px; color: #1e293b; }

/* ============ A4 EDITOR SHEET ============ */
.editor-sheet {
  background: #ffffff;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  min-height: 842px; /* A4 aspect */
  padding: 48px 56px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  outline: none;
  font-family: 'Noto Sans Devanagari', 'Calibri', Arial, sans-serif;
  font-size: 12pt;
  line-height: 1.8;
  color: #0f172a;
  position: relative;
}
.editor-sheet:empty::before {
  content: attr(data-placeholder);
  color: #94a3b8;
  font-style: italic;
  pointer-events: none;
}

/* ============ HINDI KEYBOARD ============ */
.hk-panel {
  display: none;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
.hk-panel.show { display: block; }
.hk-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.hk-key {
  min-width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px;
  font-size: 16px; font-weight: 600; cursor: pointer;
  font-family: 'Noto Sans Devanagari', sans-serif;
}
.hk-key:hover { background: #e2e8f0; border-color: var(--accent, #19398a); }
.hk-key.wide { min-width: 70px; font-size: 12px; font-family: sans-serif; font-weight: 700; }
.hk-key.backspace { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }

/* ============ STATUS / ACTIONS ============ */
.bottom-bar {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px; margin-top: 12px;
  background: #ffffff; padding: 10px 16px; border-radius: 12px;
  border: 1px solid #e5e7eb;
}
.counter-box { font-size: 13px; color: #64748b; font-weight: 600; display: flex; gap: 14px; }
.counter-box b { color: #0f172a; }
.action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-act {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
  cursor: pointer; border: none; transition: 0.15s;
}
.btn-act.print { background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; }
.btn-act.word { background: #15803d; color: #fff; }
.btn-act.pdf { background: var(--accent, #19398a); color: #fff; }
.btn-act:hover { opacity: 0.9; transform: translateY(-1px); }

/* ============ PRINT STYLING & WATERMARK ============ */
.print-hf { display: none; }
@media print {
  body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
  .toolbar-container, .template-bar, .hf-row, .hk-panel, .bottom-bar, 
  .seo-article, .related-tools-section, #doceasy-header, #doceasy-footer, .hero-box {
    display: none !important;
  }
  .main-wrap { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
  .editor-sheet {
    border: none !important; box-shadow: none !important;
    padding: 15mm !important; min-height: auto !important;
  }
  .print-hf { display: block !important; text-align: center; font-size: 10pt; color: #666; }
  .print-header { border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 14px; }
  .print-footer { border-top: 1px solid #e2e8f0; padding-top: 6px; margin-top: 14px; }

  /* Optional Watermark */
  body.show-watermark::after {
    content: "DocEasy.org";
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-35deg);
    font-size: 70pt;
    font-weight: 900;
    color: rgba(25, 57, 138, 0.06);
    pointer-events: none;
    z-index: 9999;
  }
}
</style>
</head>
<body class="show-watermark">

<div id="doceasy-header"></div>

<main class="main-wrap">

  <div class="toolbar-container">
    <!-- Font Family -->
    <div class="tb-group">
      <select class="tb-select" id="fontFamily">
        <optgroup label="Hindi (देवनागरी)">
          <option value="'Noto Sans Devanagari', sans-serif" selected>Noto Sans Devanagari</option>
          <option value="'Noto Serif Devanagari', serif">Noto Serif Devanagari</option>
          <option value="'Hind', sans-serif">Hind</option>
          <option value="'Baloo Bhai 2', cursive">Baloo Bhai 2</option>
        </optgroup>
        <optgroup label="English">
          <option value="Calibri, sans-serif">Calibri</option>
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Times New Roman', serif">Times New Roman</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
        </optgroup>
      </select>

      <select class="tb-select" id="fontSize">
        <option value="1">10pt</option>
        <option value="2">11pt</option>
        <option value="3" selected>12pt</option>
        <option value="4">14pt</option>
        <option value="5">18pt</option>
        <option value="6">24pt</option>
        <option value="7">36pt</option>
      </select>
    </div>

    <!-- Formatting -->
    <div class="tb-group">
      <button class="tb-btn" data-cmd="bold" title="Bold"><b>B</b></button>
      <button class="tb-btn" data-cmd="italic" title="Italic"><i>I</i></button>
      <button class="tb-btn" data-cmd="underline" title="Underline"><u>U</u></button>
      <button class="tb-btn" data-cmd="strikeThrough" title="Strike"><s>S</s></button>
    </div>

    <!-- Colors in One Place -->
    <div class="tb-group">
      <label class="color-picker-box" title="Text Color">
        <span style="font-weight:900;font-size:13px;border-bottom:2px solid currentColor">A</span>
        <input type="color" id="textColor" value="#0f172a">
      </label>
      <label class="color-picker-box" title="Highlight Color">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <input type="color" id="hlColor" value="#fef08a">
      </label>
    </div>

    <!-- Alignment -->
    <div class="tb-group">
      <button class="tb-btn" data-cmd="justifyLeft" title="Left"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button class="tb-btn" data-cmd="justifyCenter" title="Center"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <button class="tb-btn" data-cmd="justifyRight" title="Right"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    </div>

    <!-- Virtual Hindi Keyboard Toggle -->
    <button class="tb-btn hindi-btn" id="toggleHkBtn" type="button">
      ⌨️ हिन्दी कीबोर्ड
    </button>

    <!-- Watermark Switch -->
    <button class="wm-btn active" id="wmToggleBtn" type="button" title="Toggle Watermark for Print">
      वॉटरमार्क: चालू
    </button>
  </div>

  <!-- Header Row -->
  <div class="hf-row" id="hRow">
    <span class="hf-label">Header</span>
    <input type="checkbox" id="hCheck">
    <input type="text" class="hf-input" id="hInput" placeholder="पेज के ऊपर आने वाला हेडर (वैकल्पिक)" disabled>
  </div>

  <!-- Editor Box -->
  <div class="print-hf print-header" id="printH"></div>
  <div class="editor-sheet" id="editor" contenteditable="true" spellcheck="false" data-placeholder="यहाँ लिखना शुरू करें... (हिंदी, English, Hinglish)"></div>
  <div class="print-hf print-footer" id="printF"></div>

  <!-- Footer Row -->
  <div class="hf-row" id="fRow" style="margin-top:8px;">
    <span class="hf-label">Footer</span>
    <input type="checkbox" id="fCheck">
    <input type="text" class="hf-input" id="fInput" placeholder="पेज के नीचे आने वाला फुटर (वैकल्पिक)" disabled>
  </div>

  <!-- Virtual Hindi Keyboard Panel -->
  <div class="hk-panel" id="hkPanel">
    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
      <span style="font-size:12px;font-weight:700;color:#ea580c;">देवनागरी वर्णमाला</span>
      <button type="button" id="hkClose" style="background:none;border:none;font-size:18px;cursor:pointer;">×</button>
    </div>
    <div class="hk-grid" id="vowelsGrid"></div>
    <div class="hk-grid" id="consGrid"></div>
    <div class="hk-grid" id="matraGrid"></div>
  </div>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="counter-box">
      <span>शब्द: <b id="wc">0</b></span>
      <span>अक्षर: <b id="cc">0</b></span>
    </div>
    <div class="action-btns">
      <button class="btn-act print" id="printBtn">🖨️ प्रिंट करें</button>
      <button class="btn-act word" id="wordBtn">📄 Word (.docx)</button>
      <button class="btn-act pdf" id="pdfBtn">⬇️ PDF में सेव करें</button>
    </div>
  </div>

</main>

<div id="doceasy-footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
(function() {
  'use strict';
  const editor = document.getElementById('editor');
  let savedRange = null;

  function saveSelection() {
    const sel = window.getSelection();
    if (sel.rangeCount > 0 && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
  }

  function restoreSelection() {
    if (savedRange) {
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }
  }

  // Format Execution
  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      document.execCommand(btn.dataset.cmd, false, null);
      editor.focus();
    });
  });

  // Font Family Apply
  document.getElementById('fontFamily').addEventListener('change', function() {
    editor.focus();
    restoreSelection();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('fontName', false, this.value);
  });

  // Font Size Apply
  document.getElementById('fontSize').addEventListener('change', function() {
    editor.focus();
    restoreSelection();
    document.execCommand('fontSize', false, this.value);
  });

  // Text Color Apply
  document.getElementById('textColor').addEventListener('input', function() {
    editor.focus();
    restoreSelection();
    document.execCommand('foreColor', false, this.value);
  });

  // Highlight Color Apply
  document.getElementById('hlColor').addEventListener('input', function() {
    editor.focus();
    restoreSelection();
    document.execCommand('hiliteColor', false, this.value);
  });

  // Watermark Toggle
  const wmBtn = document.getElementById('wmToggleBtn');
  wmBtn.addEventListener('click', () => {
    const isWatermark = document.body.classList.toggle('show-watermark');
    wmBtn.classList.toggle('active', isWatermark);
    wmBtn.textContent = isWatermark ? 'वॉटरमार्क: चालू' : 'वॉटरमार्क: बंद';
  });

  // Header / Footer Handlers
  const hCheck = document.getElementById('hCheck'), hInput = document.getElementById('hInput');
  const fCheck = document.getElementById('fCheck'), fInput = document.getElementById('fInput');
  const printH = document.getElementById('printH'), printF = document.getElementById('printF');

  hCheck.addEventListener('change', () => {
    hInput.disabled = !hCheck.checked;
    if (!hCheck.checked) hInput.value = '';
    printH.textContent = hInput.value;
  });
  hInput.addEventListener('input', () => printH.textContent = hInput.value);

  fCheck.addEventListener('change', () => {
    fInput.disabled = !fCheck.checked;
    if (!fCheck.checked) fInput.value = '';
    printF.textContent = fInput.value;
  });
  fInput.addEventListener('input', () => printF.textContent = fInput.value);

  // Virtual Hindi Keyboard
  const VOWELS = ['अ','आ','इ','ई','उ','ऊ','ऋ','ए','ऐ','ओ','औ','अं','अः'];
  const CONS = ['क','ख','ग','घ','ङ','च','छ','ज','झ','ञ','ट','ठ','ड','ढ','ण','त','थ','द','ध','न','प','फ','ब','भ','म','य','र','ल','व','श','ष','स','ह','क्ष','त्र','ज्ञ'];
  const MATRAS = ['ा','ि','ी','ु','ू','ृ','े','ै','ो','ौ','ं','ँ','ः','्','।'];

  function createKeys(list, targetId) {
    const box = document.getElementById(targetId);
    list.forEach(char => {
      const k = document.createElement('button');
      k.type = 'button';
      k.className = 'hk-key';
      k.textContent = char;
      k.addEventListener('mousedown', e => e.preventDefault());
      k.addEventListener('click', () => {
        editor.focus();
        restoreSelection();
        document.execCommand('insertText', false, char);
        saveSelection();
        updateCounts();
      });
      box.appendChild(k);
    });
  }
  createKeys(VOWELS, 'vowelsGrid');
  createKeys(CONS, 'consGrid');
  createKeys(MATRAS, 'matraGrid');

  const hkPanel = document.getElementById('hkPanel');
  const toggleHkBtn = document.getElementById('toggleHkBtn');
  toggleHkBtn.addEventListener('click', () => {
    const isShown = hkPanel.classList.toggle('show');
    toggleHkBtn.classList.toggle('active', isShown);
  });
  document.getElementById('hkClose').addEventListener('click', () => {
    hkPanel.classList.remove('show');
    toggleHkBtn.classList.remove('active');
  });

  // Fast Hinglish Transliteration (Supports 2-letter tokens like ka, ki, ho)
  const HING_DICT = {
    'namaste':'नमस्ते','mera':'मेरा','aap':'आप','kya':'क्या','hai':'है','hain':'हैं',
    'ka':'का','ki':'की','ke':'के','ko':'को','se':'से','me':'में','mai':'मैं',
    'ho':'हो','shri':'श्री','bharat':'भारत','dhanyavad':'धन्यवाद','theek':'ठीक'
  };

  editor.addEventListener('input', () => {
    saveSelection();
    updateCounts();
    checkHinglish();
  });
  editor.addEventListener('keyup', saveSelection);
  editor.addEventListener('mouseup', saveSelection);

  function checkHinglish() {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    const node = sel.anchorNode;
    if (node.nodeType !== 3) return;
    const text = node.textContent.substring(0, sel.anchorOffset);
    const m = text.match(/([a-zA-Z]{2,})\s$/);
    if (!m) return;
    const word = m[1].toLowerCase();
    if (HING_DICT[word]) {
      const start = sel.anchorOffset - word.length - 1;
      const range = document.createRange();
      range.setStart(node, start);
      range.setEnd(node, sel.anchorOffset - 1);
      range.deleteContents();
      const textNode = document.createTextNode(HING_DICT[word]);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      saveSelection();
    }
  }

  function updateCounts() {
    const txt = editor.innerText || '';
    document.getElementById('cc').textContent = txt.length;
    const words = txt.trim() ? txt.trim().split(/\s+/).length : 0;
    document.getElementById('wc').textContent = words;
  }

  // Print & PDF
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('pdfBtn').addEventListener('click', () => window.print());

  // Quick Word Export
  document.getElementById('wordBtn').addEventListener('click', () => {
    const headerHtml = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
      "xmlns:w='urn:schemas-microsoft-com:office:word' "+
      "xmlns='http://www.w3.org/TR/REC-html40'>"+
      "<head><meta charset='utf-8'><title>DocEasy Document</title></head><body>";
    const footerHtml = "</body></html>";
    const sourceHTML = headerHtml + editor.innerHTML + footerHtml;
    const blob = new Blob(['\ufeff' + sourceHTML], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'DocEasy-Document.doc';
    document.body.appendChild(a);
    a.click();
    a.remove();
  });
})();
</script>
</body>
</html>
