<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocEasy — Audio Worker Test</title>
<link rel="stylesheet" href="../assets/css/doceasy-global.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 85px 12px 40px; }
  .panel { border: 1px solid #ccc; border-radius: 8px; padding: 14px; margin: 14px 0; }
  .btn { display: block; width: 100%; padding: 14px; font-size: 16px; margin: 8px 0; border-radius: 8px; border: none; color: #fff; background: #19398a; cursor: pointer; }
  .btn:disabled { background: #9aa5c9; cursor: not-allowed; }
  .btn.secondary { background: #445; }
  #logPanel { background: #0d0d12; color: #baffc9; font-family: monospace; font-size: 12px; height: 200px; overflow-y: auto; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  progress { width: 100%; height: 22px; }
  h1 { font-size: 18px; color: #19398a; }
  h2 { font-size: 15px; color: #19398a; margin-bottom: 6px; }
</style>
</head>
<body>

<div id="doceasy-header"></div>

<h1>Audio Worker — Test Harness</h1>
<p style="font-size:13px;color:#555;">Tests worker-audio.js with a hardcoded effect on the first 5 seconds.</p>

<div class="panel">
  <h2>1. Select Audio/Video File</h2>
  <input type="file" id="fileInput" accept="audio/*,video/*" style="width:100%;">
  <div id="fileInfo" style="font-size:14px; margin-top:8px;"></div>
</div>

<div class="panel">
  <h2>2. Process Audio</h2>
  <button class="btn" id="btnProcess" disabled>Apply Chipmunk Effect (0s - 5s)</button>
  <progress id="progressBar" value="0" max="100"></progress>
  <div id="progressPct" style="text-align:center; font-size:13px; margin-top:4px;">0%</div>
</div>

<div class="panel">
  <h2>3. Download Result</h2>
  <div id="resultBox" style="font-size:14px; color:#19398a;">Processed audio will appear here.</div>
</div>

<div class="panel">
  <h2>Log</h2>
  <div id="logPanel"></div>
</div>

<div id="doceasy-footer"></div>

<script src="../assets/js/core/doceasy-core.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
let logLines = [];
let selectedFile = null;
let audioContext = null;
let decodedBuffer = null;

function log(msg, isError) {
  const time = new Date().toLocaleTimeString();
  const line = `[${time}] ${msg}`;
  logLines.push(line);
  if (logLines.length > 200) logLines.shift();
  $('logPanel').textContent = logLines.join('\n');
  $('logPanel').scrollTop = $('logPanel').scrollHeight;
  if (isError) console.error('[DocEasy Test]', msg);
  else console.log('[DocEasy Test]', msg);
}

$('fileInput').addEventListener('change', async (e) => {
  selectedFile = e.target.files[0];
  if (!selectedFile) return;
  $('fileInfo').textContent = `Selected: ${selectedFile.name}`;
  $('btnProcess').disabled = true;
  log(`Decoding file: ${selectedFile.name}...`);
  
  try {
    const arrayBuffer = await selectedFile.arrayBuffer();
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    audioContext = new AudioContextClass({ sampleRate: 44100 });
    decodedBuffer = await audioContext.decodeAudioData(arrayBuffer);
    log(`Decoded. Duration: ${decodedBuffer.duration.toFixed(2)}s, Channels: ${decodedBuffer.numberOfChannels}`);
    $('btnProcess').disabled = false;
    $('resultBox').textContent = 'File decoded. Ready to process.';
  } catch (err) {
    log('Decode error: ' + err.message, true);
    $('resultBox').textContent = 'Error decoding file.';
  }
});

// Compact WAV Encoder to download the processed audio
function encodeWAV(samples, sampleRate, numChannels) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);

  const writeString = (view, offset, string) => {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
  };

  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * 2, true);
  view.setUint16(32, numChannels * 2, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, 'data');
  view.setUint32(40, samples.length * 2, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

$('btnProcess').addEventListener('click', () => {
  if (!decodedBuffer) return;
  $('btnProcess').disabled = true;
  $('progressBar').value = 0;
  $('progressPct').textContent = '0%';
  log('Spawning worker-audio.js...');

  const worker = new Worker('../assets/js/core/worker-audio.js');
  
  const channelData = [];
  for (let ch = 0; ch < decodedBuffer.numberOfChannels; ch++) {
    channelData.push(decodedBuffer.getChannelData(ch));
  }

  // Hardcoded test: Apply Chipmunk to Speaker 0 from 0s to 5s
  const segments = [
    { start: 0, end: 5, pitch: 200, speakerId: 0, confidence: 1 }
  ];
  const effectMap = {
    0: { type: 'chipmunk', pitchShift: 12 }
  };

  log('Sending data to worker...');
  worker.postMessage({
    type: 'process',
    jobId: 'test-job-1',
    sampleRate: decodedBuffer.sampleRate,
    numberOfChannels: decodedBuffer.numberOfChannels,
    channelData: channelData,
    segments: segments,
    effectMap: effectMap
  });

  worker.onmessage = (e) => {
    const msg = e.data;
    if (msg.type === 'progress') {
      const pct = Math.round((msg.processedSeconds / msg.totalSeconds) * 100);
      $('progressBar').value = pct;
      $('progressPct').textContent = pct + '%';
      log(`Worker progress: ${pct}%`);
    } else if (msg.type === 'result') {
      log('Worker returned result!');
      $('progressBar').value = 100;
      $('progressPct').textContent = '100%';
      
      // Interleave channels for WAV download
      const outChannels = msg.channelData;
      const totalSamples = outChannels[0].length;
      const interleaved = new Float32Array(totalSamples * outChannels.length);
      for (let i = 0; i < totalSamples; i++) {
        for (let ch = 0; ch < outChannels.length; ch++) {
          interleaved[i * outChannels.length + ch] = outChannels[ch][i];
        }
      }

      const wavBlob = encodeWAV(interleaved, msg.sampleRate, msg.numberOfChannels);
      const url = URL.createObjectURL(wavBlob);
      
      $('resultBox').innerHTML = `<a href="${url}" download="processed-audio.wav" style="color:#19398a; font-weight:bold;">📥 Download Processed WAV</a>`;
      log('Download link generated.');
      
      worker.terminate();
      $('btnProcess').disabled = false;
    } else if (msg.type === 'error') {
      log('Worker error: ' + msg.message, true);
      $('resultBox').textContent = 'Error: ' + msg.message;
      worker.terminate();
      $('btnProcess').disabled = false;
    }
  };
});
</script>
</body>
</html>
